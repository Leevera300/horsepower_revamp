server:
  port: 8080 # 서버 포트, 기본은 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/horsepower_revamp?useSSL=false&serverTimezone=Asia/Seoul
    username: root # ← 본인 MySQL 아이디
    password: root # ← 본인 MySQL 비밀번호

  jpa:
    hibernate:
      ddl-auto: update # 엔티티 기반으로 테이블 자동 생성/수정
    show-sql: true # 실행되는 SQL 콘솔에 출력
    properties:
      hibernate:
        format_sql: true # SQL 보기 좋게 정렬

